# One-off helper: pulls the Higgsfield-generated hero video and the 4K
# upscales of the site photography into the repo. Reads the URL list from
# .github/mainsail-assets.json. Delete both files once the assets are in.
name: Fetch Mainsail media
on:
  workflow_dispatch:
  push:
    branches: [claude/loving-brown-xu9c32]
    paths: ['.github/mainsail-assets.json', '.github/workflows/fetch-mainsail-media.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Hero video (encode web versions, extract review frames)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1
          url=$(jq -r .video .github/mainsail-assets.json)
          curl -fsSL "$url" -o /tmp/hero-src.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,duration,codec_name -of default=nw=1 /tmp/hero-src.mp4
          mkdir -p mainsail/assets/video mainsail/build/review
          ffmpeg -y -v error -i /tmp/hero-src.mp4 -an -vf "scale=1920:-2" -r 24 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart mainsail/assets/video/hero.mp4
          ffmpeg -y -v error -i /tmp/hero-src.mp4 -an -vf "scale=1280:-2" -r 24 -c:v libx264 -preset slow -crf 27 -pix_fmt yuv420p -movflags +faststart mainsail/assets/video/hero-720.mp4
          ffmpeg -y -v error -i /tmp/hero-src.mp4 -an -vf "scale=1920:-2" -r 24 -c:v libvpx-vp9 -b:v 0 -crf 34 -row-mt 1 -deadline good -cpu-used 2 -pix_fmt yuv420p mainsail/assets/video/hero.webm
          ffmpeg -y -v error -i /tmp/hero-src.mp4 -an -vf "scale=1280:-2" -r 24 -c:v libvpx-vp9 -b:v 0 -crf 36 -row-mt 1 -deadline good -cpu-used 2 -pix_fmt yuv420p mainsail/assets/video/hero-720.webm
          ffmpeg -y -v error -i /tmp/hero-src.mp4 -vf "fps=0.6,scale=480:-1,tile=3x2" -frames:v 1 -q:v 4 mainsail/build/review/hero-frames.jpg
          ls -la mainsail/assets/video mainsail/build/review
      - name: Upscaled photography (to 2800px JPEG sources)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import json, os, urllib.request
          from PIL import Image
          cfg = json.load(open('.github/mainsail-assets.json'))
          out = 'mainsail/assets/img/src'
          for name, url in cfg['images'].items():
              if not url: print('skip', name); continue
              tmp = f'/tmp/{name}.png'
              urllib.request.urlretrieve(url, tmp)
              im = Image.open(tmp).convert('RGB'); src = im.size
              im.thumbnail((2800, 2800), Image.LANCZOS)
              dst = os.path.join(out, name + '.jpg')
              im.save(dst, 'JPEG', quality=86, optimize=True, progressive=True)
              print(name, src, '->', im.size, os.path.getsize(dst))
          PY
          du -sh mainsail/assets/img/src
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mainsail/assets/video mainsail/assets/img/src mainsail/build/review
          git commit -m "Add Higgsfield hero video and 4K-upscaled photography sources" -m "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_016mMvPa8U1a3Yh9vXfeChS2" || echo "nothing to commit"
          git push
