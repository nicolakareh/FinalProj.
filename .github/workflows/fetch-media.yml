# One-off helper: downloads the generated AgroDrone media from the generation
# CDN (which this project's cloud dev environment cannot reach), optimizes it,
# and commits it to the branch the workflow is run from. Safe to delete after.
name: Fetch generated media
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Tools
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          convert -version | head -1; ffmpeg -version | head -1
      - name: Download and optimize
        env:
          BASE: https://d8j0ntlcm91z4.cloudfront.net/user_3JKxNDZEjKpo0QPElZKq05EQnbr
        run: |
          set -euo pipefail
          mkdir -p tmp agrodrone/public/media
          dl() { curl -fsSL --retry 3 -o "tmp/$1" "$BASE/$2"; echo "downloaded $1 ($(stat -c%s "tmp/$1") bytes)"; }
          dl hero-poster.png hf_20260923_161754_2cb27686-b21f-432c-8e4a-20a1b7d5a554.png
          dl aircraft.png hf_20260923_161754_3218fb0d-c7e7-468d-8fed-52d8e37c8e92.png
          dl service-fertilizer.png hf_20260923_161719_9a3ecafd-c92f-427e-8be8-0212b5edf2f3.png
          dl service-protection.png hf_20260923_161716_9f499f47-583b-46a1-8f1f-19caece00794.png
          dl service-seeding.png hf_20260923_161754_aad588bc-d469-439e-80e6-83418eb66703.png
          dl service-mapping.png hf_20260923_161715_5a402c9d-a809-41ec-93cb-817680c68f60.png
          dl hero-src.mp4 hf_20260923_162039_9f9d069a-65af-40e5-b5bc-e19aabbb14ed.mp4
          out=agrodrone/public/media
          convert tmp/hero-poster.png -resize 2400x -quality 82 -strip -interlace Plane "$out/hero-poster.jpg"
          convert tmp/aircraft.png -resize 2400x -quality 82 -strip -interlace Plane "$out/aircraft.jpg"
          for n in fertilizer protection seeding mapping; do
            convert "tmp/service-$n.png" -resize 1800x -quality 82 -strip -interlace Plane "$out/service-$n.jpg"
          done
          # Seamless loop: drop the first second, then crossfade the tail into that
          # first second so the last frame matches the first.
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,duration -of default=nw=1 tmp/hero-src.mp4
          ffmpeg -y -v error -i tmp/hero-src.mp4 -an -filter_complex \
            "[0:v]split[a][b];[a]trim=start=1,setpts=PTS-STARTPTS[main];[b]trim=0:1,setpts=PTS-STARTPTS[head];[main][head]xfade=transition=fade:duration=1:offset=4,format=yuv420p[v]" \
            -map "[v]" -c:v libx264 -preset slow -crf 22 -movflags +faststart "$out/hero.mp4"
          ls -la "$out"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agrodrone/public/media
          git commit -m "Add generated media assets (hero clip, poster, aircraft, four service shots)"
          git push
